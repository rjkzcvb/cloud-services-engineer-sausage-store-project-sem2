global:
  imageRegistry: docker.io
  namespace: r-devops-magistracy-project-2sem-272184471

backend:
  enabled: true
  image: rjkzcvb/sausage-backend
  tag: latest
  replicas: 2
  port: 8080
  resources:
    requests:
      memory: "256Mi"
      cpu: "250m"
    limits:
      memory: "512Mi"
      cpu: "500m"
  service:
    type: ClusterIP
    port: 8080
  strategy:
    type: RollingUpdate
    maxSurge: 1
    maxUnavailable: 0
  livenessProbe:
    enabled: true
    path: /actuator/health
    initialDelaySeconds: 60
    periodSeconds: 30
  postgresql:
    host: postgresql
    port: 5432
    database: sausage_store
    username: sausage_user
    password: sausage_password
  mongodb:
    uri: mongodb://mongodb:27017/reports

backend-report:
  enabled: true
  image: rjkzcvb/sausage-backend-report
  tag: latest
  replicas: 1
  port: 8081
  resources:
    requests:
      memory: "128Mi"
      cpu: "100m"
    limits:
      memory: "256Mi"
      cpu: "200m"
  service:
    type: ClusterIP
    port: 8081
  strategy:
    type: Recreate
  mongodb:
    uri: mongodb://mongodb:27017/reports
  hpa:
    enabled: true
    minReplicas: 1
    maxReplicas: 5
    targetCPUUtilizationPercentage: 75

frontend:
  enabled: true
  image: rjkzcvb/sausage-frontend
  tag: latest
  replicas: 1
  port: 80
  resources:
    requests:
      memory: "64Mi"
      cpu: "50m"
    limits:
      memory: "128Mi"
      cpu: "100m"
  service:
    type: ClusterIP
    port: 80
  ingress:
    enabled: true
    host: front-rjkzcvb.2sem.students-projects.ru
    tls:
      enabled: true
      secretName: 2sem-students-projects-wildcard-secret

infra:
  enabled: true
  postgresql:
    image: postgres:15-alpine
    port: 5432
    database: sausage_store
    username: sausage_user
    password: sausage_password
    storage:
      size: 10Gi
      storageClass: yc-network-hdd
    resources:
      requests:
        memory: "256Mi"
        cpu: "200m"
      limits:
        memory: "512Mi"
        cpu: "400m"
  mongodb:
    image: mongo:6
    port: 27017
    database: reports
    username: report_user
    password: report_password
    storage:
      size: 5Gi
      storageClass: yc-network-hdd
    resources:
      requests:
        memory: "256Mi"
        cpu: "200m"
      limits:
        memory: "512Mi"
        cpu: "400m"

vpa:
  enabled: true
  backend:
    minAllowed:
      cpu: 200m
      memory: 200Mi
    maxAllowed:
      cpu: 1
      memory: 1Gi

  mongodb:
    initJob:
      enabled: true

# VPA settings
vpa:
  enabled: true
  backend:
    minAllowed:
      cpu: 200m
      memory: 200Mi
    maxAllowed:
      cpu: 1
      memory: 1Gi
