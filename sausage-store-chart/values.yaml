environment: production

backend:
  enabled: true
  image: sausage-backend
  tag: latest
  replicas: 1
  port: 8080
  resources:
    requests:
      memory: "128Mi"
      cpu: "100m"
    limits:
      memory: "256Mi"
      cpu: "200m"
  service:
    type: ClusterIP
    port: 8080
  strategy:
    type: RollingUpdate
    maxSurge: 1
    maxUnavailable: 0
  livenessProbe:
    enabled: true
    path: /actuator/health
    initialDelaySeconds: 60
    periodSeconds: 30
  postgresql:
    host: postgresql
    port: 5432
    database: sausage_store
    username: sausage_user
    password: sausage_password
  mongodb:
    uri: mongodb://mongodb:27017/reports

backend-report:
  enabled: true
  image: sausage-backend-report
  tag: latest
  replicas: 1
  port: 8081
  resources:
    requests:
      memory: "64Mi"
      cpu: "50m"
    limits:
      memory: "128Mi"
      cpu: "100m"
  service:
    type: ClusterIP
    port: 8081
  strategy:
    type: Recreate
  mongodb:
    uri: mongodb://mongodb:27017/reports

frontend:
  enabled: true
  image: sausage-frontend
  tag: latest
  replicas: 1
  port: 80
  resources:
    requests:
      memory: "32Mi"
      cpu: "25m"
    limits:
      memory: "64Mi"
      cpu: "50m"
  service:
    type: ClusterIP
    port: 80
  ingress:
    enabled: true
    host: front-rjkzcvb.2sem.students-projects.ru
    tls:
      enabled: true
      secretName: 2sem-students-projects-wildcard-secret

infra:
  enabled: true
  postgresql:
    image: postgres:15-alpine
    port: 5432
    database: sausage_store
    username: sausage_user
    password: sausage_password
    resources:
      requests:
        memory: "128Mi"
        cpu: "100m"
      limits:
        memory: "256Mi"
        cpu: "200m"
  mongodb:
    image: mongo:6
    port: 27017
    database: reports
    username: report_user
    password: report_password
    resources:
      requests:
        memory: "128Mi"
        cpu: "100m"
      limits:
        memory: "256Mi"
        cpu: "200m"
    initJob:
      enabled: false

vpa:
  enabled: false
