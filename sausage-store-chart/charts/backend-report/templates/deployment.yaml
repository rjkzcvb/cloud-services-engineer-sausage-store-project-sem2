apiVersion: apps/v1
kind: Deployment
metadata:
  name: sausage-backend-report-{{ .Release.Name }}
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: sausage-backend-report
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/version: {{ .Chart.AppVersion | quote }}
    app.kubernetes.io/managed-by: {{ .Release.Service }}
    helm.sh/chart: "{{ .Chart.Name }}-{{ .Chart.Version }}"
    app.kubernetes.io/component: backend-report
    app.kubernetes.io/part-of: sausage-store
    env: {{ .Values.environment | default "production" }}
spec:
  replicas: {{ .Values.replicas }}
  strategy:
    type: {{ .Values.strategy.type }}
  selector:
    matchLabels:
      app: sausage-backend-report
  template:
    metadata:
      labels:
        app: sausage-backend-report
        app.kubernetes.io/name: sausage-backend-report
        app.kubernetes.io/instance: {{ .Release.Name }}
    spec:
      containers:
      - name: backend-report
        image: "{{ .Values.image }}:{{ .Values.tag }}"
        imagePullPolicy: Always
        ports:
        - containerPort: {{ .Values.port }}
          name: http
        env:
        - name: PORT
          value: {{ .Values.port | quote }}
        - name: DB
          value: {{ .Values.mongodb.uri }}
        resources:
          {{- toYaml .Values.resources | nindent 10 }}
