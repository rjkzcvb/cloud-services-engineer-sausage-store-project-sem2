{{- if .Values.vpa.enabled }}
apiVersion: autoscaling.k8s.io/v1
kind: VerticalPodAutoscaler
metadata:
  name: sausage-backend-vpa-{{ .Release.Name }}
  namespace: {{ .Release.Namespace }}
  labels:
    app: sausage-backend
    app.kubernetes.io/name: sausage-backend
    app.kubernetes.io/instance: {{ .Release.Name }}
spec:
  targetRef:
    apiVersion: "apps/v1"
    kind: Deployment
    name: sausage-backend-{{ .Release.Name }}
  updatePolicy:
    updateMode: "Off"
  resourcePolicy:
    containerPolicies:
    - containerName: backend
      minAllowed:
        cpu: {{ .Values.vpa.backend.minAllowed.cpu | default "200m" }}
        memory: {{ .Values.vpa.backend.minAllowed.memory | default "200Mi" }}
      maxAllowed:
        cpu: {{ .Values.vpa.backend.maxAllowed.cpu | default "1" }}
        memory: {{ .Values.vpa.backend.maxAllowed.memory | default "1Gi" }}
{{- end }}
