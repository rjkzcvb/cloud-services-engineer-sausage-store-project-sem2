name: Sausage Store Deploy

on:
  push:
    branches:
      - main

env:
  NEXUS_HELM_REPO: ${{ secrets.NEXUS_HELM_REPO }}
  NEXUS_HELM_REPO_USER: ${{ secrets.NEXUS_HELM_REPO_USER }}
  NEXUS_HELM_REPO_PASSWORD: ${{ secrets.NEXUS_HELM_REPO_PASSWORD }}
  NAMESPACE: r-devops-magistracy-project-2sem-272184471
  DOCKER_USER: ${{ secrets.DOCKER_USER }}
  DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}
  STUDENT_NAME: ${{ secrets.STUDENT_NAME }}

jobs:
  # JOB 1: BUILD AND PUSH
  build_and_push_to_docker_hub:
    name: Build & Push to Docker Hub
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      
      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v2
      
      - name: Login to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USER }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      
      - name: Build & Push Backend
        uses: docker/build-push-action@v4
        with:
          context: ./backend
          push: true
          tags: ${{ secrets.DOCKER_USER }}/sausage-backend:latest
      
      - name: Build & Push Frontend
        uses: docker/build-push-action@v4
        with:
          context: ./frontend
          push: true
          tags: ${{ secrets.DOCKER_USER }}/sausage-frontend:latest
      
      - name: Build & Push Backend-report
        uses: docker/build-push-action@v4
        with:
          context: ./backend-report
          push: true
          tags: ${{ secrets.DOCKER_USER }}/sausage-backend-report:latest

  # JOB 2: ADD TO NEXUS
  add_helm_chart_to_nexus:
    name: Add Helm Chart to Nexus
    runs-on: ubuntu-latest
    needs: build_and_push_to_docker_hub
    steps:
      - uses: actions/checkout@v3
      
      - name: Setup Helm
        uses: azure/setup-helm@v3
      
      - name: Package Helm Chart
        run: |
          cd sausage-store-chart
          helm package . --version 0.1.0
      
      - name: Upload to Nexus
        run: |
          curl -u ${{ env.NEXUS_HELM_REPO_USER }}:${{ env.NEXUS_HELM_REPO_PASSWORD }} \
            --upload-file ./sausage-store-chart/sausage-store-0.1.0.tgz \
            ${{ env.NEXUS_HELM_REPO }}/sausage-store-0.1.0.tgz

  # JOB 3: DEPLOY TO KUBERNETES
  deploy_helm_chart_to_kubernetes:
    name: Deploy to Kubernetes
    runs-on: ubuntu-latest
    needs: add_helm_chart_to_nexus
    steps:
      - uses: actions/checkout@v3
      
      - name: Setup Helm
        uses: azure/setup-helm@v3
      
      - name: Setup kubectl
        uses: azure/setup-kubectl@v3
      
      - name: Configure kubeconfig
        run: |
          mkdir -p $HOME/.kube
          echo "${{ secrets.KUBE_CONFIG }}" | base64 -d > $HOME/.kube/config
      
      - name: Deploy
        run: |
          helm upgrade --install sausage-store ./sausage-store-chart \
            --namespace ${{ env.NAMESPACE }} \
            --set backend.image=${{ secrets.DOCKER_USER }}/sausage-backend \
            --set backend.tag=latest \
            --set backend-report.image=${{ secrets.DOCKER_USER }}/sausage-backend-report \
            --set backend-report.tag=latest \
            --set frontend.image=${{ secrets.DOCKER_USER }}/sausage-frontend \
            --set frontend.tag=latest \
            --set frontend.ingress.host=front-${{ secrets.STUDENT_NAME }}.2sem.students-projects.ru
      
      - name: Verify
        run: kubectl get pods -n ${{ env.NAMESPACE }}
