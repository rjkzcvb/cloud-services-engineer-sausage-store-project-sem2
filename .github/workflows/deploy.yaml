name: Sausage Store Deploy

on:
  push:
    branches:
      - main

env:
  NEXUS_HELM_REPO: ${{ secrets.NEXUS_HELM_REPO }}
  NEXUS_HELM_REPO_USER: ${{ secrets.NEXUS_HELM_REPO_USER }}
  NEXUS_HELM_REPO_PASSWORD: ${{ secrets.NEXUS_HELM_REPO_PASSWORD }}
  NAMESPACE: r-devops-magistracy-project-2sem-272184471
  DOCKER_USER: ${{ secrets.DOCKER_USER }}
  DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}
  STUDENT_NAME: ${{ secrets.STUDENT_NAME }}

jobs:
  build_and_push_to_docker_hub:
    name: Push Docker images to DockerHub
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2
      - name: Login to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USER }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      - name: Build and push Backend
        uses: docker/build-push-action@v4
        with:
          context: ./backend
          push: true
          tags: ${{ secrets.DOCKER_USER }}/sausage-backend:latest
      - name: Build and push Frontend
        uses: docker/build-push-action@v4
        with:
          context: ./frontend
          push: true
          tags: ${{ secrets.DOCKER_USER }}/sausage-frontend:latest
      - name: Build and push Backend-report
        uses: docker/build-push-action@v4
        with:
          context: ./backend-report
          push: true
          tags: ${{ secrets.DOCKER_USER }}/sausage-backend-report:latest

  deploy_helm_chart_to_kubernetes:
    name: Deploy Helm Chart To Kubernetes
    runs-on: ubuntu-latest
    needs: build_and_push_to_docker_hub
    steps:
      - uses: actions/checkout@v3
      
      - name: Setup Helm
        uses: azure/setup-helm@v3
      
      - name: Setup kubectl
        uses: azure/setup-kubectl@v3
      
      - name: Create kubeconfig from secret
        run: |
          mkdir -p $HOME/.kube
          echo '${{ secrets.KUBE_CONFIG }}' | base64 -d > $HOME/.kube/config
          chmod 600 $HOME/.kube/config
          cat $HOME/.kube/config | head -5
      
      - name: Test connection
        run: |
          kubectl cluster-info
          kubectl get ns
      
      - name: Deploy
        run: |
          helm upgrade --install sausage-store ./sausage-store-chart \
            --namespace ${{ env.NAMESPACE }} \
            --set backend.image=${{ secrets.DOCKER_USER }}/sausage-backend \
            --set backend.tag=latest \
            --set backend-report.image=${{ secrets.DOCKER_USER }}/sausage-backend-report \
            --set backend-report.tag=latest \
            --set frontend.image=${{ secrets.DOCKER_USER }}/sausage-frontend \
            --set frontend.tag=latest \
            --set frontend.ingress.host=front-${{ secrets.STUDENT_NAME }}.2sem.students-projects.ru
      
      - name: Verify
        run: kubectl get pods -n ${{ env.NAMESPACE }}
